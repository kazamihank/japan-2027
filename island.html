<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#cfe6ea">
<title>福岡旅行島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2f2a25; --muted:#7b7067; --paper:#fbf6ee; --card:#fffdf9; --line:#ece2d4;
  --accent:#d9653b; --shadow:0 6px 20px rgba(70,45,20,.16);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --num:'Space Grotesk',ui-monospace,'SF Mono',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#cfe6ea;color:var(--ink);font-family:var(--font)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#app{position:fixed;inset:0;overflow:hidden}
#app canvas{display:block;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;z-index:1}

/* island pills */
.pill{display:flex;align-items:center;gap:6px;pointer-events:auto;cursor:pointer;user-select:none;-webkit-user-select:none;
  background:var(--card);border-radius:999px;padding:7px 13px 7px 11px;box-shadow:var(--shadow);
  font-weight:700;font-size:14px;line-height:1;white-space:nowrap;transition:opacity .3s,background .3s,color .3s}
.pill b{font-family:var(--num);font-size:13px;color:var(--accent);transition:color .3s}
.pill.dim{opacity:.38}
.pill.on{background:var(--dc,var(--accent));color:#fff}
.pill.on b{color:#fff;opacity:.85}
#labels.compact .pill{padding:6px 9px;font-size:12px}
#labels.compact .pill .nm{display:none}
#labels.compact .pill.on .nm{display:inline}
.bed{pointer-events:none;font-size:12px;font-weight:700;background:rgba(255,253,249,.92);border-radius:999px;padding:3px 8px;box-shadow:var(--shadow);transition:opacity .3s}
#labels.far .bed{opacity:0}
.tag{pointer-events:none;font-size:11px;font-weight:700;color:#fff;border-radius:999px;padding:3px 8px;opacity:0;transition:opacity .3s}
#labels.tags .tag{opacity:1}

/* brand */
#brand{position:fixed;z-index:5;top:calc(12px + var(--sat));left:calc(12px + var(--sal));
  display:flex;align-items:center;gap:12px;background:rgba(251,246,238,.94);border-radius:22px;padding:12px 16px 12px 14px;box-shadow:var(--shadow);max-width:calc(100vw - 112px)}
#brand .big{font-family:var(--num);font-weight:700;color:var(--accent);font-size:26px;line-height:.92;letter-spacing:-.5px}
#brand .zh{font-weight:900;font-size:17px;letter-spacing:2px;line-height:1.25}
#brand .zh small{display:block;font-weight:700;font-size:11.5px;letter-spacing:.5px;color:var(--muted);margin-top:3px}
#brand .zh small em{font-style:normal;font-family:var(--num);color:var(--accent);letter-spacing:1px}

/* right rail */
#rail{position:fixed;z-index:5;top:calc(12px + var(--sat));right:calc(12px + var(--sar));display:flex;flex-direction:column;gap:8px}
.rb{width:66px;height:54px;border-radius:17px;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:700;font-size:13px}
.rb i{font-style:normal;font-size:15px;line-height:1}
.rb.on{background:var(--ink);color:#fff}

/* day bar */
#days{position:fixed;z-index:6;left:calc(10px + var(--sal));right:calc(10px + var(--sar));bottom:calc(10px + var(--sab));
  display:flex;gap:3px;background:var(--card);border-radius:20px;padding:5px;box-shadow:var(--shadow);max-width:600px;margin:0 auto}
.dbtn{flex:1 1 0;min-width:0;border-radius:15px;padding:7px 0 6px;text-align:center;transition:background .25s,color .25s}
.dbtn b{display:block;font-family:var(--num);font-size:14px;line-height:1.1}
.dbtn span{display:block;font-size:10.5px;color:var(--muted);margin-top:2px;font-family:var(--num)}
.dbtn.on{background:var(--dc,var(--ink));color:#fff}
.dbtn.on span{color:rgba(255,255,255,.85)}

/* time popover */
#timepop{position:fixed;z-index:7;right:calc(88px + var(--sar));top:calc(12px + var(--sat));background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:12px;width:220px;display:none}
#timepop.open{display:block}
#timepop h5{margin:0 0 8px;font-size:12px;color:var(--muted);font-weight:700}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:10px}
.seg button{border-radius:11px;padding:8px 0;font-size:13px;font-weight:700;background:var(--paper)}
.seg button.on{background:var(--ink);color:#fff}
.seg2{grid-template-columns:1fr 1fr}

/* sheet */
#sheet{position:fixed;z-index:8;left:0;right:0;bottom:0;max-height:58dvh;display:flex;flex-direction:column;
  background:var(--paper);border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(60,40,20,.18);
  transform:translateY(110%);transition:transform .34s cubic-bezier(.2,.8,.2,1),max-height .3s}
#sheet.open{transform:none}
#sheet.full{max-height:88dvh}
#sheet .grab{flex:none;height:22px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#sheet .grab::after{content:'';width:42px;height:5px;border-radius:9px;background:#d9cfc1}
#sh-head{flex:none;padding:0 18px 10px;position:relative}
#sh-close{position:absolute;right:12px;top:-6px;width:36px;height:36px;border-radius:50%;background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.08);font-size:18px;line-height:36px;text-align:center}
#sh-body{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:0 18px calc(20px + var(--sab))}
.kick{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px;flex-wrap:wrap;padding-right:44px}
.kick .no{font-family:var(--num);color:#fff;background:var(--dc,var(--accent));border-radius:8px;padding:2px 8px;font-size:13px}
#sh-head h2{margin:0;font-size:21px;line-height:1.3;font-weight:900;padding-right:40px}
#sh-head .sub{margin:6px 0 0;font-size:13.5px;color:var(--muted);line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700;background:var(--card);border:1px solid var(--line)}
button.chip{cursor:pointer}
.chip.c{color:#fff;border-color:transparent;background:var(--dc)}
.dayh{display:flex;align-items:center;gap:8px;margin:16px 0 2px;font-size:13px;font-weight:900}
.dayh i{font-style:normal;font-family:var(--num);color:#fff;background:var(--dc);border-radius:7px;padding:1px 7px}
.it{display:grid;grid-template-columns:50px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.dayh + .it{border-top:0}
.it .tm{font-family:var(--num);font-weight:700;font-size:13.5px;color:var(--dc,var(--accent));padding-top:1px;word-break:keep-all}
.it h4{margin:0;font-size:15px;line-height:1.45}
.it p{margin:4px 0 0;font-size:13px;color:var(--muted);line-height:1.6}
.it .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.lk{display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:0 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--ink);text-decoration:none}
.lk::after{content:'↗';font-size:11px;color:var(--muted)}
.at{display:inline-flex;align-items:center;gap:5px;min-height:32px;padding:0 11px;border-radius:999px;background:#f3ebdf;font-size:12.5px;font-weight:700}
.at b{font-family:var(--num);color:var(--accent)}
.note{margin:16px 0 0;padding:12px 14px;border-radius:14px;background:#f3ebdf;font-size:13px;line-height:1.65;color:#5b5047}
.foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.foot a{flex:1 1 auto;text-align:center;padding:12px;border-radius:14px;background:var(--ink);color:#fff;text-decoration:none;font-weight:700;font-size:14px}
.tabs{display:flex;gap:4px;background:#efe6d9;border-radius:14px;padding:4px;margin-top:12px}
.tabs button{flex:1;border-radius:11px;padding:8px 0;font-weight:700;font-size:13.5px}
.tabs button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.tk{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 0;border-top:1px solid var(--line)}
.tk:first-child{border-top:0}
.tk h4{margin:0;font-size:14.5px;line-height:1.45}
.tk p{margin:0;grid-column:1/-1;font-size:13px;color:var(--muted);line-height:1.6}
.st{align-self:start;font-size:11.5px;font-weight:900;border-radius:999px;padding:3px 9px;white-space:nowrap}
.st.ok{background:#e1efdc;color:#3c7a35}.st.todo{background:#fbe3d6;color:#b24f22}.st.day{background:#e4ecf3;color:#3e6a8f}
.crew{display:grid;grid-template-columns:40px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:start;text-align:left;width:100%}
.crew:first-child{border-top:0}
.crew .av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:15px}
.crew h4{margin:0;font-size:15px}.crew h4 small{font-weight:700;color:var(--muted);font-size:12px;margin-left:6px}
.crew p{margin:4px 0 0;font-size:13px;color:var(--muted);line-height:1.6}
.dl{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.dl:first-child{border-top:0}
.dl i{font-style:normal;font-family:var(--num);font-weight:700;color:#fff;background:var(--dc);border-radius:8px;padding:3px 8px;font-size:13px}
.dl b{font-size:14.5px;display:block;line-height:1.4}.dl span{font-size:12px;color:var(--muted)}
.dl em{font-style:normal;color:var(--muted);font-size:18px}

#toast{position:fixed;z-index:9;left:50%;bottom:calc(84px + var(--sab));transform:translate(-50%,40px);opacity:0;transition:transform .35s,opacity .35s;background:var(--ink);color:#fff;border-radius:14px;padding:10px 16px;font-size:13.5px;font-weight:700;box-shadow:var(--shadow);max-width:calc(100vw - 32px);text-align:center}
#toast.show{transform:translate(-50%,0);opacity:1}
#fail{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:24px;background:var(--paper);text-align:center;line-height:1.7}
#fail.show{display:flex}
#fail a{color:var(--accent);font-weight:700}

@media (max-width:420px){
  #brand{gap:9px;padding:10px 13px 10px 12px;border-radius:19px}
  #brand .big{font-size:21px}
  #brand .zh{font-size:15px;letter-spacing:1px}
  #brand .zh small{font-size:10.5px}
  .rb{width:58px;height:50px;font-size:12px;border-radius:15px}
  #timepop{right:calc(78px + var(--sar))}
  .pill{font-size:13px;padding:6px 11px 6px 9px}
}
@media (min-width:900px){
  #sheet{left:calc(16px + var(--sal));right:auto;top:150px;bottom:16px;width:400px;max-height:none;border-radius:24px;transform:translateX(calc(-100% - 40px))}
  #sheet.full{max-height:none}
  #sheet .grab{display:none}
  #sh-head{padding-top:18px}
  #sh-close{top:12px}
  #days{bottom:calc(16px + var(--sab))}
}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

}}
</script>

<body>
<div id="app"></div>

<header id="brand">
  <div class="big">FUKUOKA<br>7 DAYS.</div>
  <div class="zh">九州北部 旅行島<small><em>2027.4.17–23</em>・5 人</small></div>
</header>

<nav id="rail" aria-label="工具">
  <button class="rb" id="b-all"><i>↗</i>全景</button>
  <button class="rb" id="b-today"><i>◎</i>今天</button>
  <button class="rb" id="b-crew"><i>☺</i>角色</button>
  <button class="rb" id="b-list"><i>≡</i>清單</button>
  <button class="rb" id="b-time"><i>◷</i>時間</button>
</nav>

<div id="timepop" role="dialog" aria-label="時間">
  <h5>天色</h5>
  <div class="seg" id="tp-sky">
    <button data-sky="dawn">清晨</button><button data-sky="day">白天</button><button data-sky="dusk">黃昏</button><button data-sky="night">夜晚</button>
  </div>
  <h5>動畫（人、船、馬、列車）</h5>
  <div class="seg seg2" id="tp-anim"><button data-anim="1">開</button><button data-anim="0">關</button></div>
</div>

<nav id="days" aria-label="選日子"></nav>

<section id="sheet" aria-live="polite">
  <div class="grab" id="sh-grab" title="展開／收合"></div>
  <header id="sh-head"></header>
  <div id="sh-body"></div>
</section>

<div id="toast"></div>
<div id="fail"><div>3D 島嶼載入失敗（可能是網路擋了 cdn.jsdelivr.net，或瀏覽器不支援 WebGL）。<br><a href="fukuoka.html">改看文字版手冊 →</a></div></div>
<noscript><div style="padding:24px">這一頁需要 JavaScript。<a href="fukuoka.html">改看文字版手冊</a></div></noscript>

<script>

  setTimeout(function(){ if(!window.__islandOK){ document.getElementById('fail').classList.add('show'); } }, 8000);

<script type="module">

/* =====================================================================
   資料區：要改行程、連結、團員，改這一段就好
   ===================================================================== */
const gm = q => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
const TB = p => 'https://tabelog.com/' + p + '/';
const HANDBOOK = 'fukuoka.html';

const DAYS = [
  {d:1, date:'4/17', wd:'六', color:'#e0603a', sleep:'博多', title:'抵達博多', main:'hakata',
   route:['airport','hakata'],
   sum:'04:00 起床飛福岡。拉麵、寺町散步、回飯店補眠，傍晚鐵鍋餃子接中洲屋台。'},
  {d:2, date:'4/18', wd:'日', color:'#e39a2f', sleep:'博多', title:'門司港・唐戶＋佐賀夜間賽馬', main:'mojiko',

// 島：x/z 是相對位置（博多在原點，東 +x、南 +z），r 是島的大小
const ISLANDS = [

   desc:'對岸已經是本州。週末的唐戶市場「馬関街」是現握壽司攤，本團不吃河豚。'},
  {id:'saga',    no:'07', name:'佐賀競馬', jp:'佐賀競馬場（鳥栖）', x:3.5,  z:18,  r:4.2, c:'#9fc27f',

  {id:'yufuin',  no:'08', name:'由布院', jp:'由布院・金鱗湖', x:24,   z:8.5,  r:4.2, c:'#8fbf7a',
   desc:'由布岳山腳的溫泉小鎮。坐觀光列車ゆふいんの森進來，下午巴士下山去別府。'},

function prep(geo, norm = true){
  geo = geo.index ? geo.toNonIndexed() : geo;
  if (geo.attributes.uv) geo.deleteAttribute('uv');
  geo.computeBoundingBox();
  const b = geo.boundingBox, s = new THREE.Vector3(); b.getSize(s);
  geo.translate(-(b.min.x+b.max.x)/2, -b.min.y, -(b.min.z+b.max.z)/2);
  if (norm) geo.scale(1/s.x, 1/s.y, 1/s.z);
  geo.computeVertexNormals();
  return geo;
}

  for (const [k, arr] of Object.entries(INST)){
    const glow = GLOW[k];
    const im = new THREE.InstancedMesh(GEO[glow ? glow.geo : k], glow ? glow.mat : MAT, arr.length);
    arr.forEach(([m,c],i)=>{ im.setMatrixAt(i,m); im.setColorAt(i,c); });
    im.castShadow = !glow; im.receiveShadow = !glow;
    scene.add(im);
  }
}

function islandBase(I, interactive = true){

// 每座島的佔位（避免亂撒的房子樹木壓到地標）
function makeLayout(I){
  const occ = [];
  const X = lx=>I.x+lx, Z = lz=>I.z+lz;
  const mark = (lx,lz,rad)=>occ.push([lx,lz,rad]);
  const free = (lx,lz,rad)=>Math.hypot(lx,lz) < I.r*.8 - rad*.4 && occ.every(([a,b,r])=>Math.hypot(lx-a,lz-b) > r+rad);
  const scatter = (n, rad, fn, tries = 60)=>{
    for (let k=0;k<n;k++){ for (let t=0;t<tries;t++){ const ang=R(0,Math.PI*2), d=Math.sqrt(rnd())*I.r*.82, lx=Math.cos(ang)*d, lz=Math.sin(ang)*d; if (free(lx,lz,rad)){ mark(lx,lz,rad); fn(X(lx),Z(lz),lx,lz); break; } } }
  };
  const freePts = ()=>{ const pts=[]; for (let lx=-I.r;lx<=I.r;lx+=.5) for (let lz=-I.r;lz<=I.r;lz+=.5) if (free(lx,lz,.15)) pts.push(new THREE.Vector3(X(lx),TOP,Z(lz))); return pts; };
  return {X,Z,mark,free,scatter,freePts,occ};
}

function colored(geo, col){
  geo = geo.index ? geo.toNonIndexed() : geo;
  if (geo.attributes.uv) geo.deleteAttribute('uv');
  geo.computeVertexNormals();
  const c = new THREE.Color(col), n = geo.attributes.position.count, a = new Float32Array(n*3);
  for (let i=0;i<n;i++){ a[i*3]=c.r; a[i*3+1]=c.g; a[i*3+2]=c.b; }
  geo.setAttribute('color', new THREE.BufferAttribute(a,3));
  return geo;
}

function updateWalkers(dt, t){
  for (const w of walkers){
    if (w.hop){ // 團員換島：跳過去
      w.hop.k = Math.min(1, w.hop.k + dt/w.hop.dur);
      const e = w.hop.k; w.mesh.position.lerpVectors(w.hop.a, w.hop.b, e); w.mesh.position.y = TOP + Math.sin(e*Math.PI)*w.hop.h;
      if (e >= 1){ w.hop = null; w.to = null; w.wait = R(.5,1.5); }
      continue;
    }
    if (w.wait > 0){ w.wait -= dt; w.mesh.position.y = TOP; continue; }
    if (!w.to){ const pts = walkSpots[w.island]; w.to = pts[Math.floor(rnd()*pts.length)]; }
    const p = w.mesh.position, dx = w.to.x-p.x, dz = w.to.z-p.z, d = Math.hypot(dx,dz);
    if (d < .05){ w.to = null; w.wait = R(1,4); continue; }
    const step = Math.min(d, w.speed*dt); p.x += dx/d*step; p.z += dz/d*step;
    p.y = TOP + Math.abs(Math.sin(t*9 + w.speed*10))*.05;
    w.mesh.rotation.y = Math.atan2(dx,dz);
  }
}

let W = 1, H = 1, offCur = {x:0,y:0}, offGoal = {x:0,y:0};
function uiRect(){
  const narrow = W < 700, desk = W >= 900;
  let l = 8, r = W-8, t = 8, b = H-8;
  const rail = $('#rail').getBoundingClientRect(); r = Math.min(r, rail.left-6);
  const brand = $('#brand').getBoundingClientRect(); if (narrow) t = brand.bottom + 6;
  b = Math.min(b, $('#days').getBoundingClientRect().top - 6);
  if (sheetOpen){
    const sh = $('#sheet');
    if (desk) l = Math.max(l, 16 + sh.offsetWidth + 10);
    else b = Math.min(b, H - sh.offsetHeight - 6);
  }
  if (b - t < 120) t = Math.max(8, b - 120);
  return {l,r,t,b};
}
function setOffsetGoal(){ const u = uiRect(); offGoal = {x: W/2 - (u.l+u.r)/2, y: H/2 - (u.t+u.b)/2}; return u; }
function applyOffset(cam, o){ cam.setViewOffset(W,H,o.x,o.y,W,H); cam.updateProjectionMatrix(); }

const tmpCam = camera.clone();
function fitView(ids, {pol=null, extra=2.9, pad=1, search=false} = {}){
  const u = setOffsetGoal();
  const pts = [];
  for (const id of ids){ const I=ISL[id]; const rr=I.r*pad; for (const [dx,dz] of [[0,0],[rr,0],[-rr,0],[0,rr],[0,-rr]]) pts.push(new THREE.Vector3(I.x+dx,TOP,I.z+dz)); pts.push(new THREE.Vector3(I.x,TOP+extra,I.z)); }
  const box = new THREE.Box3().setFromPoints(pts), center = box.getCenter(new THREE.Vector3()); center.y = TOP;
  const sph = new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target));
  tmpCam.fov = camera.fov; tmpCam.aspect = W/H; applyOffset(tmpCam, offGoal);
  const nx0 = 2*u.l/W-1, nx1 = 2*u.r/W-1, ny0 = 1-2*u.b/H, ny1 = 1-2*u.t/H;
  const solve = (phi, theta)=>{
    const ok = d=>{ tmpCam.position.setFromSpherical(new THREE.Spherical(d,phi,theta)).add(center); tmpCam.lookAt(center); tmpCam.updateMatrixWorld();
      return pts.every(p=>{ const v=p.clone().project(tmpCam); return v.z<1 && v.x>=nx0 && v.x<=nx1 && v.y>=ny0 && v.y<=ny1; }); };
    let lo = 6, hi = 400; for (let i=0;i<26;i++){ const m=(lo+hi)/2; ok(m)?hi=m:lo=m; } return hi; };
  let best;
  if (search){ // 直式螢幕：找最省空間的角度（相機大致在南邊，北方朝上）
    for (const th of [-.9,-.6,-.3,0,.3,.6,.9]) for (const ph of [.6,.75,.86]){ const d = solve(ph, th) * (1 + Math.abs(th)*.12); if (!best || d < best.d) best = {d, ph, th}; }
    best.d /= (1 + Math.abs(best.th)*.12);
  } else { const ph = pol ?? THREE.MathUtils.clamp(sph.phi, .62, .98); best = {ph, th:sph.theta, d:solve(ph, sph.theta)}; }
  flyTo(center, new THREE.Spherical(Math.min(best.d, 260), best.ph, best.th));
}
let tween = null;
function flyTo(target, sph, ms=950){
  const s0 = new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target));
  let dth = sph.theta - s0.theta; dth = Math.atan2(Math.sin(dth), Math.cos(dth));
  tween = {t0:performance.now(), ms, T0:controls.target.clone(), T1:target.clone(), s0, s1:new THREE.Spherical(sph.radius, sph.phi, s0.theta+dth)};
}
function stepTween(now){
  if (!tween) return;
  const k = Math.min(1,(now-tween.t0)/tween.ms), e = 1-Math.pow(1-k,3);
  controls.target.lerpVectors(tween.T0, tween.T1, e);
  const s = new THREE.Spherical(tween.s0.radius+(tween.s1.radius-tween.s0.radius)*e, tween.s0.phi+(tween.s1.phi-tween.s0.phi)*e, tween.s0.theta+(tween.s1.theta-tween.s0.theta)*e);
  camera.position.setFromSpherical(s).add(controls.target);
  if (k>=1) tween = null;
}
const ALL = ISLANDS.map(I=>I.id);
function overview(){ fitView(ALL, W < H ? {search:true} : {pol:.86}); }

/* ---------- 介面 ---------- */
const state = {day:0, island:null, panel:null};
let sheetOpen = false;
const sheet = $('#sheet'), head = $('#sh-head'), body = $('#sh-body');

const daysEl = $('#days');
daysEl.innerHTML = `<button class="dbtn" data-day="0"><b>全部</b><span>7 天</span></button>` + DAYS.map(D=>`<button class="dbtn" data-day="${D.d}" style="--dc:${D.color}"><b>D${D.d}</b><span>${D.date}</span></button>`).join('');
daysEl.addEventListener('click', e=>{ const b=e.target.closest('[data-day]'); if (b) selectDay(+b.dataset.day); });

function linksHTML(links){ return links && links.length ? `<div class="row">${links.map(([t,u])=>`<a class="lk" href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>`).join('')}</div>` : ''; }
function itemHTML(it, showIsland){
  const I = ISL[it.i], D = DAYS[it.d-1];
  return `<div class="it" style="--dc:${D.color}"><div class="tm">${it.t}</div><div><h4>${it.title}</h4>${it.note?`<p>${it.note}</p>`:''}${showIsland||it.links.length?`<div class="row">${showIsland?`<button class="at" data-isl="${I.id}"><b>${I.no}</b>${I.name}</button>`:''}${it.links.map(([t,u])=>`<a class="lk" href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>`).join('')}</div>`:''}</div></div>`;
}
const handbookLink = `<div class="foot"><a href="${HANDBOOK}">📖 完整手冊（時刻表、票價、日文小卡）</a></div>`;

function showSheet(headHTML, bodyHTML, dc){
  head.innerHTML = headHTML + `<button id="sh-close" aria-label="關閉">✕</button>`;
  head.style.setProperty('--dc', dc || 'var(--accent)');
  body.innerHTML = bodyHTML; body.scrollTop = 0;
  sheet.classList.add('open'); sheetOpen = true;
}
function closeSheet(){ sheet.classList.remove('open','full'); sheetOpen = false; state.panel = null; state.island = null; setRail(); refreshPills(); setOffsetGoal(); }
head.addEventListener('click', e=>{
  if (e.target.id==='sh-close'){ closeSheet(); setHash(state.day?'d'+state.day:''); return; }
  const d = e.target.closest('[data-day]'); if (d) selectDay(+d.dataset.day);
  const tb = e.target.closest('[data-tab]'); if (tb) renderList(tb.dataset.tab);
});
body.addEventListener('click', e=>{
  const a = e.target.closest('[data-isl]'); if (a){ openIsland(a.dataset.isl); return; }
  const d = e.target.closest('[data-day]'); if (d){ selectDay(+d.dataset.day); return; }
  const c = e.target.closest('[data-crew]'); if (c){ const w=crew[+c.dataset.crew]; fitView([w.island]); }
});
$('#sh-grab').addEventListener('click', ()=>{ sheet.classList.toggle('full'); setTimeout(setOffsetGoal, 320); });

function refreshPills(){
  const D = state.day ? DAYS[state.day-1] : null;
  for (const I of ISLANDS){
    const el = pills[I.id]; el.classList.remove('on','dim'); el.style.removeProperty('--dc');
    if (D){ if (D.route.includes(I.id)){ el.classList.add('on'); el.style.setProperty('--dc', D.color); } else el.classList.add('dim'); }
    if (state.island === I.id){ el.classList.add('on'); el.classList.remove('dim'); if (!D) el.style.setProperty('--dc','var(--accent)'); }
  }
  routeLayers.forEach((L,k)=>{ const on = !state.day || state.day===k+1; L.im.visible = on; L.mat.opacity = state.day ? 1 : .5;
    for (let i=0;i<L.pts.length;i++){ _m.compose(L.pts[i],_q.identity(),_s.set(state.day?.34:.24,.07,state.day?.34:.24)); L.im.setMatrixAt(i,_m); } L.im.instanceMatrix.needsUpdate = true; });
  traveler.visible = !!(D && routeLayers[state.day-1].pts.length);
  if (D) traveler.material.color.set(D.color), travelerRing.material.color.set(D.color);
  daysEl.querySelectorAll('.dbtn').forEach(b=>b.classList.toggle('on', +b.dataset.day === state.day));
}
function setRail(){ for (const [id,p] of [['b-crew','crew'],['b-list','list']]) $('#'+id).classList.toggle('on', state.panel===p); }
function setHash(h){ history.replaceState(null,'', h ? '#'+h : location.pathname + location.search); }

function selectDay(d){
  state.day = d; state.island = null; state.panel = null; setRail();
  if (!d){ closeSheet(); refreshPills(); overview(); crewTo('hakata'); setHash(''); return; }
  const D = DAYS[d-1];
  const items = ITEMS.filter(it=>it.d===d);
  showSheet(
    `<div class="kick"><span class="no">D${d}</span>${D.date}（${D.wd}）<span class="chip" style="padding:2px 9px">🛏 ${D.sleep}</span></div><h2>${D.title}</h2><p class="sub">${D.sum}</p>`,
    items.map(it=>itemHTML(it,true)).join('') + handbookLink, D.color);
  refreshPills();
  fitView([...new Set(D.route)]);
  crewTo(D.main); travelT = 0;
  setHash('d'+d);
}
function openIsland(id){
  const I = ISL[id]; state.island = id; state.panel = null; setRail();
  const its = ITEMS.filter(it=>it.i===id);
  const days = [...new Set(its.map(it=>it.d))];
  if (state.day && days.includes(state.day)) days.sort((a,b)=>(b===state.day)-(a===state.day));
  const bodyHTML = days.map(d=>{ const D=DAYS[d-1]; return `<div class="dayh" style="--dc:${D.color}"><i>D${d}</i>${D.date}（${D.wd}）${D.title}</div>` + its.filter(it=>it.d===d).map(it=>itemHTML(it,false)).join(''); }).join('')
    + (I.bed ? `<div class="note">${I.bed}：${id==='hakata'?'ドーミーインPREMIUM博多・キャナルシティ前（首選，還沒訂）。4/19–21 大行李寄放在這。':'西鉄リゾートイン別府（首選，還沒訂），別府駅走 1 分。'}</div>` : '')
    + handbookLink;
  showSheet(
    `<div class="kick"><span class="no">${I.no}</span>${I.jp}</div><h2>${I.name}</h2><p class="sub">${I.desc}</p><div class="chips">${days.slice().sort().map(d=>`<button class="chip c" data-day="${d}" style="--dc:${DAYS[d-1].color}">D${d} ${DAYS[d-1].date}</button>`).join('')}</div>`,
    bodyHTML, 'var(--accent)');
  refreshPills();
  fitView([id], {extra:3.4, pad:1.35});
  setHash(id);
}
function renderList(tab='days'){
  state.panel = 'list'; state.island = null; setRail(); refreshPills();
  const tabs = `<div class="tabs">${[['days','行程'],['tix','票券・預約'],['stay','住宿']].map(([k,t])=>`<button data-tab="${k}" class="${k===tab?'on':''}">${t}</button>`).join('')}</div>`;
  let html = '';
  if (tab==='days') html = DAYS.map(D=>`<button class="dl" data-day="${D.d}" style="--dc:${D.color}"><i>D${D.d}</i><div><b>${D.title}</b><span>${D.date}（${D.wd}）・住${D.sleep.replace('✈ ','')}・${ITEMS.filter(it=>it.d===D.d).length} 個點</span></div><em>›</em></button>`).join('');
  if (tab==='tix') html = TICKETS.map(([st,t,p])=>`<div class="tk"><h4>${t}</h4><span class="st ${st}">${{ok:'已訂',todo:'未訂',day:'當天'}[st]}</span><p>${p}</p></div>`).join('') + `<div class="note">訂位時間軸以 2026/10 查到的規則為準，2027/3 JR 改點後要再確認一次。</div>`;
  if (tab==='stay') html = STAYS.map(([d,t,p,id])=>`<div class="tk"><h4>${d}　${t}</h4><button class="at" data-isl="${id}"><b>${ISL[id].no}</b>${ISL[id].name}</button><p>${p}</p></div>`).join('');
  showSheet(`<div class="kick"><span class="no">≡</span>THE TRIP INDEX</div><h2>清單</h2>${tabs}`, html + handbookLink);
}
function renderCrew(){
  state.panel = 'crew'; state.island = null; setRail(); refreshPills();
  showSheet(`<div class="kick"><span class="no">☺</span>THE CREW</div><h2>五個人，各管一件事</h2><p class="sub">島上穿彩色衣服的就是你們，會跟著你選的日子跳到那天的島。點名字可以找人。</p>`,
    CREW.map((c,k)=>`<button class="crew" data-crew="${k}"><span class="av" style="background:${c.color}">${c.name.replace('團員 ','')[0]}</span><div><h4>${c.name}<small>${c.role}</small></h4><p>${c.job}</p></div></button>`).join('')
    + `<div class="note">分工是建議。名字和工作直接改 island.html 上方的 <b>CREW</b>。</div>`);
}

$('#b-all').onclick = ()=>overview();
$('#b-list').onclick = ()=>{ if (state.panel==='list'){ closeSheet(); return; } renderList(); labelsEl.classList.remove('tags'); };
$('#b-crew').onclick = ()=>{ if (state.panel==='crew'){ closeSheet(); labelsEl.classList.remove('tags'); return; } renderCrew(); labelsEl.classList.add('tags'); fitView([crew[0].island]); };
$('#b-today').onclick = ()=>{
  const tokyo = new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Tokyo'}));
  const start = new Date(2027,3,17), diff = Math.floor((new Date(tokyo.getFullYear(),tokyo.getMonth(),tokyo.getDate()) - start)/864e5);
  if (diff >= 0 && diff < 7){ selectDay(diff+1); toast(`今天是 D${diff+1}`); }
  else if (diff < 0){ selectDay(1); toast(`還沒出發：距離 4/17 還有 ${-diff} 天`); }
  else { selectDay(7); toast('旅程已經結束了'); }
};
const tp = $('#timepop');
$('#b-time').onclick = e=>{ e.stopPropagation(); tp.classList.toggle('open'); $('#b-time').classList.toggle('on', tp.classList.contains('open')); };
tp.addEventListener('click', e=>{ e.stopPropagation(); const s=e.target.closest('[data-sky]'); if (s) setSky(s.dataset.sky); const a=e.target.closest('[data-anim]'); if (a) setAnim(a.dataset.anim==='1'); });
document.addEventListener('click', ()=>{ tp.classList.remove('open'); $('#b-time').classList.remove('on'); });
let animOn = !LOW;
function setAnim(on){ animOn = on; document.querySelectorAll('#tp-anim button').forEach(b=>b.classList.toggle('on', (b.dataset.anim==='1')===on)); }
setAnim(animOn);
addEventListener('keydown', e=>{ if (e.key==='Escape') closeSheet(); });

let toastT; function toast(msg, ms=2600){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'), ms); }

/* ---------- 點擊 3D 物件 ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let down = null;
renderer.domElement.addEventListener('pointerdown', e=>{ down = {x:e.clientX, y:e.clientY, t:performance.now()}; });
renderer.domElement.addEventListener('pointerup', e=>{
  if (!down || Math.hypot(e.clientX-down.x, e.clientY-down.y) > 7 || performance.now()-down.t > 450) return;
  ndc.set(e.clientX/W*2-1, -(e.clientY/H)*2+1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(pickables, false)[0];
  if (!hit) return;
  if (hit.object.userData.crew !== undefined){ renderCrew(); labelsEl.classList.add('tags'); }
  else if (hit.object.userData.island) openIsland(hit.object.userData.island);
});

/* ---------- 尺寸與迴圈 ---------- */
function resize(){
  W = app.clientWidth; H = app.clientHeight;
  renderer.setSize(W,H); labelR.setSize(W,H);
  camera.aspect = W/H; setOffsetGoal(); offCur = {...offGoal}; applyOffset(camera, offCur);
}
addEventListener('resize', ()=>{ resize(); });
resize();

// 初始畫面
camera.position.set(0, 60, 60); controls.target.set(0,TOP,0);
{
  const h = decodeURIComponent(location.hash.slice(1)), q = Q.get('focus');
  const key = q || h;
  const m = /^d([1-7])$/.exec(key);
  if (m) { overviewInstant(); selectDay(+m[1]); }
  else if (key && ISL[key]) { overviewInstant(); openIsland(key); }
  else { overviewInstant(); refreshPills(); }
}
function overviewInstant(){ overview(); if (tween){ tween.t0 = -1e9; stepTween(performance.now()); } }
if (!location.hash) setTimeout(()=>toast(COARSE ? '單指拖曳移動・雙指縮放旋轉・點標籤看細節' : '拖曳移動・右鍵旋轉・滾輪縮放・點標籤看細節', 4200), 600);

const clock = new THREE.Clock();
let acc = 0, simT = 0, hidden = false;
document.addEventListener('visibilitychange', ()=>{ hidden = document.hidden; });
const FRAME = COARSE ? 1/30 : 1/60;
renderer.setAnimationLoop(now=>{
  if (hidden) return;
  const dt = Math.min(clock.getDelta(), .1);
  acc += dt; if (acc < FRAME*.92) return;
  const step = Math.min(acc, .1); acc = 0;
  if (animOn){ simT += step; for (const f of ANIM) f(step, simT); updateWalkers(step, simT); updateSteam(step); }
  else { for (const w of crew) if (w.hop) updateWalkers(step, simT); }
  if (traveler.visible){
    const P = routeLayers[state.day-1].pts; travelT = (travelT + step*9) % (P.length + 12);
    const i = Math.min(P.length-1, Math.floor(travelT)); traveler.position.copy(P[i]); traveler.position.y += .35;
    travelerRing.scale.setScalar(1.1 + Math.sin(simT*6)*.25);
  }
  applySky(Math.min(1, step*2.2));
  offCur.x += (offGoal.x-offCur.x)*Math.min(1,step*7); offCur.y += (offGoal.y-offCur.y)*Math.min(1,step*7); applyOffset(camera, offCur);
  stepTween(performance.now());
  controls.update();
  const dist = camera.position.distanceTo(controls.target);
  scene.fog.near = dist + 40; scene.fog.far = dist + 260;
  const ppu = H / (2*dist*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)));
  labelsEl.classList.toggle('compact', ppu < 11 && W < 900 || ppu < 7);
  labelsEl.classList.toggle('far', ppu < 30);
  renderer.render(scene, camera);
  labelR.render(scene, camera);
});
</script>
